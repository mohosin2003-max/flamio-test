name: Attendance photo sweep safety tests

on:
  pull_request:
    paths:
      - "supabase/functions/attendance-task-photo-orphan-sweep/**"
      - ".github/workflows/attendance-photo-sweep-tests.yml"
  push:
    branches: ["safety/attendance-photo-retention"]
    paths:
      - "supabase/functions/attendance-task-photo-orphan-sweep/**"
      - ".github/workflows/attendance-photo-sweep-tests.yml"

permissions:
  contents: read

jobs:
  mocked-sweep-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run mocked sweep and handler tests only
        run: deno test --no-check supabase/functions/attendance-task-photo-orphan-sweep/sweep.test.ts supabase/functions/attendance-task-photo-orphan-sweep/handler.test.ts
