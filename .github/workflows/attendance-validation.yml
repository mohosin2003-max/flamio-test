name: Attendance branch validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/attendance-master-safe]

permissions:
  contents: read

concurrency:
  group: attendance-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Lint attendance implementation (excluding repository formatting rule)
        run: npx eslint src/lib/attendance.functions.ts src/routes/_authenticated/owner.attendance.tsx --rule 'prettier/prettier: off'
