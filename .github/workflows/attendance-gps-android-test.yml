name: Attendance GPS Android test APK
on:
  pull_request:
    branches: [main]
    paths: ['android-attendance-gps/**', 'supabase/functions/attendance-gps-transition/**', '.github/workflows/attendance-gps-android-test.yml']
  push:
    branches: [main, feature/attendance-native-gps-apk, 'fix/**']
    paths: ['android-attendance-gps/**', 'supabase/functions/attendance-gps-transition/**', '.github/workflows/attendance-gps-android-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android-attendance-gps
        run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: flamio-attendance-gps-test-apk
          path: android-attendance-gps/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
