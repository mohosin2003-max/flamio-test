name: Attendance photo retention tests

on:
  pull_request:
    paths:
      - "supabase/functions/attendance-task-photo-orphan-sweep/**"
      - ".github/workflows/attendance-photo-retention-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mocked-sweep-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check pure sweep helper
        run: deno check supabase/functions/attendance-task-photo-orphan-sweep/sweep.ts
      - name: Run mock-only safety tests
        run: deno test --allow-none supabase/functions/attendance-task-photo-orphan-sweep/sweep.test.ts
